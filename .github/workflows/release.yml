name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release at a time per tag. Never cancel one in flight: half of this job
# publishes a GitHub release and the other half pushes the opkg feed, and a run
# killed between the two leaves a release nobody can install from the feed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and refresh the feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag against version.py and the changelog
        id: check
        run: |
          version=$(python - <<'PY'
          import re
          src = open("src/MQTTBridge/version.py", encoding="utf-8").read()
          print(re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', src, re.M).group(1))
          PY
          )
          tag="${GITHUB_REF_NAME}"
          echo "version.py: $version"
          echo "tag:        $tag"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match version.py ($version)"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag can be pushed at any commit, including one whose CI run was red or
      # never ran at all. The checks below are the same ones ci.yml runs, on the
      # same Python, so nothing can be released that CI would have rejected. A
      # red check here aborts the release before anything is published.
      - name: Install the tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pyflakes
        run: |
          files=$(git ls-files '*.py' | grep -v '^src/MQTTBridge/_vendor/')
          echo "$files"
          pyflakes $files

      - name: pytest
        run: pytest -q

      - name: The contract, against the release before this one
        # The same check ci.yml's Contract job runs. On the tagged commit it also refuses an
        # exception still marked "unreleased", or one dated to anything but this release: a tag
        # published with either would leave the record wrong for good, and every later CI run
        # red. Refusing here stops the release before anything is published.
        run: python tools/check-contract.py --previous tag

      - name: Install gettext
        # msgfmt compiles the .po files into the package.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext

      - name: Build the IPK
        run: ./tools/build-ipk.sh

      - name: Extract the release notes
        run: |
          python - "${{ steps.check.outputs.version }}" <<'PY' > release-notes.md
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # The section ends at the next heading, at the link-reference block
          # Keep a Changelog puts at the foot of the file, or at EOF. Without
          # that middle case the oldest release's notes end with a paragraph of
          # "[1.2.0]: https://github.com/..." lines nobody wants in a release.
          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## |^\[[^\]]+\]:|\Z)",
              re.S | re.M,
          )
          match = pattern.search(text)
          sys.stdout.write(match.group(1).strip() + "\n" if match else "")
          PY
          cat release-notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.ipk
            dist/*.ipk.sha256
          fail_on_unmatched_files: true

      - name: Put the package into the opkg feed
        run: |
          version="${{ steps.check.outputs.version }}"
          # Stage everything the gh-pages checkout will need before switching
          # branches: gh-pages carries the feed, not the sources.
          mkdir -p /tmp/release
          cp dist/*.ipk dist/*.ipk.sha256 /tmp/release/
          cp tools/make-feed.py /tmp/make-feed.py
          # The feed commit is the workflow's, not a person's: it is generated
          # output, and attributing it to a maintainer puts their address in the
          # public history of a branch they never touched.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p feed
          cp /tmp/release/*.ipk /tmp/release/*.ipk.sha256 feed/
          python3 /tmp/make-feed.py feed/
          git add feed
          if git diff --cached --quiet; then
            echo "feed unchanged"
          else
            git commit -m "Publish $version to the opkg feed"
            git push origin gh-pages
          fi
